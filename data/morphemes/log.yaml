type: root
core_meaning: word / speech / discourse
zh: 词；话语；言说
origin: Greek logos = word, speech, reason
senses:
  - meaning: speech / discourse
    zh: 话语；言说
    examples:
      - monologue
      - dialogue
      - prologue
similar_form:

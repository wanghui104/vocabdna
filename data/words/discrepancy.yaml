id: discrepancy
word: discrepancy
pos: noun
zh: 差异；不一致；不相符之处
en: a mismatch between things, especially figures or accounts expected to agree
components:
  - morpheme: dis
    form: dis-
    meaning_in_word: apart; differently / 分开；不同
    zh: 分开；不
    role: prefix
    is_core: false
    note: 与 crepare 组合后表示声音不一致，进而指不相符。
  - morpheme: crep
    form: crep
    meaning_in_word: sound; rattle / 发声；咔嗒作响
    zh: 发声；咔嗒作响
    role: root
    is_core: true
    note: Latin crepare → discrepare“不协调、不一致”。
  - morpheme: ancy
    form: -ancy
    meaning_in_word: state or instance / 状态或具体表现
    zh: 状态
    role: suffix
    is_core: false
    note: 对应 Latin discrepantia；与形容词 discrepant 对照。
word_family:
  - discrepancies
  - discrepant
  - discrepantly
word_family_details:
  - word: discrepancies
    en: the plural of discrepancy: differences or inconsistencies
    zh: 差异；多处不一致；不符之处（复数）
  - word: discrepant
    en: not agreeing with something else
    zh: 不一致的；有差异的；相互矛盾的
  - word: discrepantly
    en: in ways that do not agree
    zh: 不一致地；有出入地
confusables:
  []
examples:
  - en: We found a discrepancy between the invoice and the delivery record.
    zh: 我们发现发票与交货记录之间有一处不符。
  - en: The two totals show a discrepancy of five units.
    zh: 两个合计数相差五个单位。
why_confusing: 正确拼写 discrepancy /dɪˈskrepənsi/，不是 descrepancy。常用 a discrepancy between A and B、discrepancies in the records。difference 泛指差别；discrepancy 常突出本应一致却不符，不一定表示有人故意造假。

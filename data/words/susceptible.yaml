word_family:
  - susceptible-to
  - susceptibility
  - susceptibilities
  - susceptibly
word_family_details:
  - word: susceptible-to
    en: likely to be affected by a specified influence
    zh: 易受……影响的；易发生……的
  - word: susceptibility
    en: the tendency to be affected by something; also a physical measure of response to a field
    zh: 易感性；易受影响的程度；感受性；（物理）磁化率或电极化率
  - word: susceptibilities
    en: plural of susceptibility: tendencies to be affected, or personal feelings and sensitivities
    zh: 易感倾向；敏感之处；感情、自尊（复数）
  - word: susceptibly
    en: in a manner that is easily influenced or emotionally affected
    zh: 易受影响地；易动感情地
confusables:
  []
examples:
  - en: The metal is susceptible to corrosion.
    zh: 这种金属容易受到腐蚀。
  - en: He is particularly susceptible to flattery.
    zh: 他尤其容易受到奉承的影响。
  - en: The claim is susceptible to verification.
    zh: 这一说法可以加以核实。
why_confusing: 读音 /səˈseptəbəl/。通常用 susceptible to + 名词或动名词；正式用法也有 susceptible of。它不等同于 allergic“过敏的”。receptive 常强调愿意接纳，susceptible 常强调容易受到作用或影响。

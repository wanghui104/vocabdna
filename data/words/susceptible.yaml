id: susceptible
word: susceptible
pos: adjective
zh: 易受影响的；易感的；易动感情的；可接受某种处理的
en: easily affected by an influence, emotionally impressionable, or capable of undergoing a process
components:
  - morpheme: sus
    form: sus-

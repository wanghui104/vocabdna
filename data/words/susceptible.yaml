    related_morphemes:
      - sub
  - morpheme: cept
    form: cept
    meaning_in_word: take; receive / 拿；接受
    zh: 取；理解
    role: root
    is_core: true
    note: Latin susceptus 的词干部分；更深层 capere 见词根页。
    related_morphemes:
      - cap
  - morpheme: ible
    form: -ible
    meaning_in_word: able to be / 能被……的
    zh: 可……的
    role: suffix

id: exponential
word: exponential
pos: adjective
zh: 指数的；按指数变化的
en: relating to an exponent; changing by a constant multiplicative factor over equal intervals
components:
  - morpheme: e
    form: ex-
    meaning_in_word: out, from / 出、向外
    zh: 出；离开；加强
    role: prefix
    is_core: false
    note: Latin ex-/e- 通常表示出、离开，也可表彻底、加强；exaggerate/exhilarate/evident 等按具体词义处理，不机械翻译为向外。
  - morpheme: pon
    form: pon
    meaning_in_word: put, place / 放置
    zh: 放置
    role: root
    is_core: true
    note: ex- + pon- + -ent + -ial；exponent 深层 exponere = ex- + ponere 放置，-ent 为分词层。指数增长不是所有迅速增长的严格同义词。
  - morpheme: ent
    form: -ent
    meaning_in_word: one who, that which, having the quality of / ……的人；具有……性质的
    zh: 具有…性质
    role: suffix
    is_core: false
  - morpheme: al
    form: -ial
    meaning_in_word: relating to / 属于……的
    zh: 属于……的
    role: suffix
    is_core: false
    note: -al 来自 Latin -alis；-ial 对应 -ialis，-ual 对应 -ualis，其中 i/u 原为词干或连接元音，后类推为后缀变体。
word_family:

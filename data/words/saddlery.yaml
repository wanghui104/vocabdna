id: saddlery
word: saddlery
pos: noun
zh: 鞍具制作业；鞍具；鞍具店
en: the craft of making saddles, the goods made, or a shop selling them
components:
  - morpheme: saddle
    form: saddl
    meaning_in_word: saddle; burden / 马鞍；加负担
    zh: 鞍
    role: root
    is_core: true
    note: saddle 去词尾 e 的书写形式。
  - morpheme: ery
    form: -ery
    meaning_in_word: trade, goods, or place / 行业、制品或场所
    zh: 场所；活动
    role: suffix
    is_core: false
    note: 表层教学用 saddl- + -ery；早期行业义来自 saddler + -y，后来的商店义可能按 saddle + -ery 重新理解。
word_family:
  - saddle
  - saddled
  - saddling
  - saddler
  - saddleless
word_family_details:
  - word: saddle
    en: a riding seat or saddle-shaped landform; to fit a saddle or impose a burden
    zh: 马鞍；自行车座；鞍部；给……装鞍；使背负负担
  - word: saddled
    en: equipped with a saddle or burdened with something; the past tense and past participle of saddle
    zh: 装了鞍的；背负负担的；装了鞍（过去式、过去分词）
  - word: saddling
    en: the present participle of saddle: fitting a saddle or imposing a burden
    zh: 正在装鞍；使承担（现在分词）
  - word: saddler
    en: a person who makes, repairs, or sells saddles and related riding equipment
    zh: 马鞍匠；鞍具商
  - word: saddleless
    en: having no saddle
    zh: 无鞍的；未装鞍的
confusables:
  []
examples:
  - en: She learned saddlery from an experienced craftsperson.
    zh: 她向一位经验丰富的工匠学习鞍具制作。
  - en: The store stocks a wide range of saddlery.
    zh: 这家店备有多种鞍具。
  - en: We bought a new saddle at the local saddlery.
    zh: 我们在当地鞍具店买了一个新马鞍。
why_confusing: saddler 是人，saddlery 是行业、器具总称或店铺；器具总称常不可数，店铺义可数。

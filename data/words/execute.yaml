    role: root
    is_core: true
    note: 表层 ex- + ecute。历史 exsequi = ex- 出、彻底 + sequi 跟随，分词 exsecutus；x 后 s 省写形成 execut-，因此 ecute 是 secut- 的表层变体，不是新词根。

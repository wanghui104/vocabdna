id: primitive
word: primitive
pos: adjective/noun
zh: 原始的；早期的；简陋的；基本的；基本概念（名词）
en: belonging to an early stage, simple and undeveloped, or fundamental; as a noun, a basic concept
components:
  - morpheme: primit
    form: primit
    meaning_in_word: first; original / 最初；原始
    zh: 最初；原始
    role: root
    is_core: true
    note: 源于 Latin primitus，深层 primus“第一”见词根页。
    related_morphemes:
      - prim
  - morpheme: ive
    form: -ive
    meaning_in_word: having the nature of / 具有……性质的
    zh: 具有……性质的；倾向于……的
    role: suffix
    is_core: false
    note: 对应 Latin primitivus 中的形容词构词层。
word_family:
  - primitively
  - primitiveness
  - primitivity
  - primitivism
  - primitivist
word_family_details:
  - word: primitively
    en: in a simple, rudimentary, or early form
    zh: 原始地；简陋地
  - word: primitiveness
    en: the quality of being early, rudimentary, or undeveloped
    zh: 原始性；简陋程度
  - word: primitivity
    en: the quality or state of being primitive; primitiveness
    zh: 原始性；简陋性
  - word: primitivism
    en: an artistic style drawing on forms regarded as early or nonacademic, or a belief favoring a simple life close to nature
    zh: 原始主义（艺术风格或思想倾向）
  - word: primitivist
    en: a person associated with primitivism; relating to its style or ideas
    zh: 原始主义者；原始主义的
confusables:

examples:
  - en: The museum displays primitive tools made from stone.
    zh: 博物馆展出了早期的石制工具。
  - en: The shelter had primitive cooking facilities.
    zh: 这个住所只有简陋的烹饪设施。
  - en: The theory begins with a few primitive concepts.
    zh: 该理论从几个基本概念出发。
  - en: In this theory, space is treated as a primitive.
    zh: 在这一理论中，空间被视为一个基本概念。
why_confusing: primitive 不只指年代古老，也能指设施简陋或理论上的基本项。称当代人群或文化为 primitive 可能含贬义，应说明具体特征。prime、primary 是独立同源词，不是此词的变形。

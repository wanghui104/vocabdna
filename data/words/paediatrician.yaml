why_confusing: 英式常用拼写；对应美式 ped-。 指医生；学科用 pediatrics，形容词用 pediatric。 pediatric 的 ped-/paed- 是 Greek pais/paidos 儿童；pedestrian 的 pedestr- 来自 Latin pes/pedis 足，不能把两者当成同源词。

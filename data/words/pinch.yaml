examples:
  - en: Pinch the dough firmly to seal each dumpling.
    zh: 把面皮捏紧，封好每个饺子的口。
  - en: Stir a pinch of cinnamon into the warm milk.
    zh: 往温牛奶里搅入一撮肉桂粉。
  - en: Small shops are feeling the pinch as rents rise.
    zh: 随着租金上涨，小店开始感受到经济压力。
  - en: In a pinch, a clean jar can serve as a vase.
    zh: 必要时，干净的罐子可以充当花瓶。
  - en: Someone has pinched my umbrella from the stand.
    zh: 有人从伞架上偷走了我的伞。
  - en: Pinch off the tips to encourage bushier growth.
    zh: 掐去嫩梢，促使植株长得更茂密。

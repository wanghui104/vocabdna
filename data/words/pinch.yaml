id: pinch
word: pinch
pos: verb/noun
zh: 捏；夹痛；一撮；困境、经济压力；（英口语）偷拿
en: to grip or hurt with a small squeeze; a tiny quantity; difficulty or financial pressure; informally, to steal
components:
  - morpheme: pinch
    form: pinch
    meaning_in_word: squeeze between two points / 捏、夹
    zh: 捏；两点夹紧
    role: root
    is_core: true
    note: 源于中古英语 pinchen 和古法语 pincier；更早来源有争议，不拆成 pin + ch。
word_family:
  - pinched
  - pinching
  - pincher
word_family_details:
  - word: pinched
    en: compressed or painfully squeezed; looking thin and drawn; also the past tense and past participle of pinch
    zh: 受夹压的；（面容）消瘦憔悴的；pinch 的过去式和过去分词
  - word: pinching
    en: the ongoing action of squeezing a small area, or pressure that hurts
    zh: 正在捏、夹；夹捏动作；夹痛的
  - word: pincher
    en: a person or thing that pinches; in the plural, an alternative word for pincers
    zh: 捏夹者；夹持物；（复数 pinchers）钳子

word_family_details:
  - word: artificial
    en: made by people rather than nature, or not natural or sincere
    zh: 人造的；人工的；虚假的；矫揉造作的
  - word: artificially
    en: through human intervention, or in a forced or unnatural way
    zh: 人工地；人为地；不自然地

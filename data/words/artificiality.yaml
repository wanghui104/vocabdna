    form: -ial
    meaning_in_word: relating to / ……的
    zh: 属于……的
    role: suffix
    is_core: false
    note: Latin artificialis 的形容词层；表层人工性质词干 artificial 可继续加 -ly 或 -ity。
  - morpheme: ity
    form: -ity
    meaning_in_word: state or quality / 状态、性质

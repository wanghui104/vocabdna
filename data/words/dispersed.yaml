    form: spers
    meaning_in_word: scatter / 撒开、散布
    zh: 散布；分散
    role: root
    is_core: true
    note: disperse 接词尾时采用 dispers-；教学拆分保留 di- + spers-。
  - morpheme: ed
    form: -ed
    meaning_in_word: past or resulting state / 过去或结果状态
    zh: 已经……的
    role: suffix

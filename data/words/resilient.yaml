  - morpheme: ent
    form: -ent
    meaning_in_word: having the quality / 具有这种性质的
    zh: 具有…性质
    role: suffix
    is_core: false
word_family:
  - resilience
  - resiliency
  - resiliently
word_family_details:
  - word: resilience
    en: the capacity to recover or adapt after difficulty, or to regain shape after pressure
    zh: 恢复力；韧性；适应力；回弹性
  - word: resiliency
    en: the capacity to recover or adapt after difficulty, or to regain shape after pressure
    zh: 恢复力；韧性；适应力；回弹性
  - word: resiliently

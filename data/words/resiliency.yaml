id: resiliency
word: resiliency
pos: noun
zh: 恢复力；韧性；适应力；回弹性
en: the capacity to recover or adapt after difficulty, or to regain shape after pressure
components:
  - morpheme: re
    form: re-
    meaning_in_word: back / 回
    zh: 回、再、反向
    role: prefix
    is_core: false
    note: 在此表示弹回，不是简单重复做一次。
  - morpheme: sali
    form: sili
    meaning_in_word: leap, spring / 跳跃、弹起
    zh: 跳出；跃起
    role: root
    is_core: true
    note: Latin salire 跳跃在 resilire 中变为 -silire；保留 sili-，再接词尾。
  - morpheme: ency
    form: -ency
    meaning_in_word: state or quality / 状态、性质
    zh: 状态；性质
    role: suffix
    is_core: false
    note: 表层 -ency 表抽象性质；与 resilience 属同一名词家族，不能解释成 resilience + -y 的直接拼接。
word_family:
  - resilience
  - resilient
  - resiliently
word_family_details:
  - word: resilience
    en: the capacity to recover or adapt after difficulty, or to regain shape after pressure
    zh: 恢复力；韧性；适应力；回弹性
  - word: resilient
    en: able to recover or adapt after setbacks, or to return to shape after being pressed
    zh: 有韧性的；恢复力强的；有回弹性的
  - word: resiliently
    en: in a way that shows the ability to recover or adapt
    zh: 坚韧地；有恢复力地；富有适应力地
confusables:
  - word: resistance
    reason: 读音 /rɪˈzɪliənsi/。resiliency 与 resilience 意义通常相同，都可用于人、组织、系统或材料。 表示一般能力时通常不可数。resistance 侧重抵抗或阻止影响，resilience/resiliency 侧重受扰后的恢复或适应，具体含义随领域而变。

id: pedestrian
word: pedestrian
pos: noun/adjective
zh: 行人；步行的，行人专用的；平庸的，乏味的
en: a person travelling on foot; relating to walking; also ordinary and lacking interest
components:
  - morpheme: pedestr
    form: pedestr
    meaning_in_word: on foot / 步行的
    zh: 步行的；足
    role: root
    is_core: true
    note: 表层 pedestr- 来自 Latin pedester；更深层 ped- 来自 pes/pedis 足，关联 root:ped。
    related_morphemes:
      - ped
  - morpheme: ian
    form: -ian
    meaning_in_word: relating to; person / 与……有关；人
    zh: 属于……的人
    role: suffix
    is_core: false
    note: 这里既可构成形容词，也可构成表示人的名词。
word_family:
  - pedestrianize
  - pedestrianization
  - pedestrianized
  - pedestrianise
  - pedestrianisation
  - pedestrianised
word_family_details:
  - word: pedestrianize
    en: to convert a street or area to use by people on foot rather than vehicles
    zh: 使成为步行区；禁止车辆进入（某区域）
  - word: pedestrianization
    en: the process of converting a street or district into an area for pedestrians
    zh: 步行化；步行区改造
  - word: pedestrianized
    en: converted to use by pedestrians; the past tense and past participle of pedestrianize
    zh: 已改为步行区的；使成为步行区（过去式、过去分词）
